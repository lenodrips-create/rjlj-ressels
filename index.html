<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <header class="site-header">
    <a href="#" class="logo-link">
      <img src="images/logo-rjlj.png" alt="RJ&amp;LJ logo" class="logo-top">
      <img src="images/logo-reselling.png" alt="Reselling" class="logo-bottom">
    </a>

    <div class="header-right">
      <button class="cart-btn" aria-label="Cart">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="20" r="1.4"></circle>
          <circle cx="18" cy="20" r="1.4"></circle>
          <path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 7H6"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="products">
    <div class="product">
      <div class="product-img">
        <img src="images/hellstar-tee.png" alt="Hellstar long sleeve">
      </div>
      <p class="product-name">Hellstar Tee</p>
      <p class="product-price">N/A</p>
    </div>

    <div class="product">
      <div class="product-img">
        <img src="images/supreme-socks.png" alt="Supreme socks">
      </div>
      <p class="product-name">Supreme Socks</p>
      <p class="product-price">N/A</p>
    </div>

    <div class="product">
      <div class="product-img">
        <img src="images/jordan-4.png" alt="Air Jordan 4s">
      </div>
      <p class="product-name">Jordan 4</p>
      <p class="product-price">N/A</p>
    </div>

    <div class="product">
      <div class="product-img">
        <img src="images/sp5der-hoodie.png" alt="Sp5der hoodie">
      </div>
      <p class="product-name">Sp5der Hoodie</p>
      <p class="product-price">N/A</p>
    </div>
  </main>

</body>
</html>
